
name: ShopSphere CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            adarshinfinia/ecommerce-backend:${{ github.sha }}
            adarshinfinia/ecommerce-backend:latest

      # 5. Build and push frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            adarshinfinia/ecommerce-frontend:${{ github.sha }}
            adarshinfinia/ecommerce-frontend:latest

      # 6. Setup SSH
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 7. Connect to EC2 and deploy
     
     
      - name: Deploy to Kubernetes
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euxo pipefail

          echo "Checking EC2 host..."
          test -n "$EC2_HOST"
          test -n "$EC2_USER"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "Testing SSH port..."
          timeout 10 bash -c "echo > /dev/tcp/$EC2_HOST/22"

          echo "Collecting SSH host key..."
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "Testing SSH authentication..."
          ssh -v -o BatchMode=yes -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" "echo SSH_CONNECTED"

          echo "Deploying images..."
          ssh "$EC2_USER@$EC2_HOST" "
            sudo k3s kubectl set image deployment/ecommerce-backend ecommerce-backend=adarshinfinia/ecommerce-backend:$IMAGE_TAG -n ecommerce &&
            sudo k3s kubectl set image deployment/ecommerce-frontend ecommerce-frontend=adarshinfinia/ecommerce-frontend:$IMAGE_TAG -n ecommerce &&
            sudo k3s kubectl rollout status deployment/ecommerce-backend -n ecommerce --timeout=180s &&
            sudo k3s kubectl rollout status deployment/ecommerce-frontend -n ecommerce --timeout=180s
          "

